<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>글로벌 경로 구간 지정</title>
<style>
:root{font-family:system-ui,"Noto Sans KR",sans-serif;color:#18251f;background:#f1f3ef}*{box-sizing:border-box}body{margin:0;padding:18px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1400px;margin:0 auto 12px}h1{font-size:22px;margin:0}.hint{color:#506057;font-size:14px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools button,.tools a{border:1px solid #c5d0c7;border-radius:8px;background:white;color:#19382a;padding:9px 12px;text-decoration:none;cursor:pointer;font:inherit}.tools button:hover,.tools a:hover{background:#e1eee5}.card{max-width:1400px;margin:auto;background:white;border:1px solid #d3ddd5;border-radius:12px;padding:12px;box-shadow:0 6px 24px #18352212}.canvas-wrap{position:relative;width:100%;height:min(70vh,760px);min-height:420px;background:#14241e;border-radius:8px;overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block;cursor:crosshair}.status{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 4px 2px}.point{font-weight:700}.a{color:#53e08b}.b{color:#ff8277}.result{font-size:18px;font-weight:800;margin-left:auto}.small{color:#647169;font-size:12px;margin-top:8px}@media(max-width:700px){body{padding:9px}.canvas-wrap{min-height:360px;height:60vh}.result{width:100%;margin-left:0}}
</style></head>
<body>
<header><div><h1>글로벌 경로 구간 지정</h1><div class="hint">초록 경로의 시작·끝을 차례로 클릭하면 거리(m)가 계산됨</div></div><div class="tools"><button id="fit">전체 경로</button><button id="clear">선택 초기화</button><a href="/">수집기</a></div></header>
<main class="card"><div class="canvas-wrap"><canvas id="map"></canvas></div><div class="status"><span class="point a" id="start">시작점 A: 미선택</span><span class="point b" id="end">끝점 B: 미선택</span><span class="result" id="result">경로 불러오는 중…</span></div><div class="small">휠: 확대·축소 · 드래그: 이동 · 클릭: A, B 지정 · 노란 숫자: 경로 시작점부터 거리 · 경로에 가까운 곳을 클릭해야 선택됨</div></main>
<script>
const canvas=document.querySelector('#map'),ctx=canvas.getContext('2d');let pts=[],cum=[],total=0,view={scale:1,cx:0,cy:0},picked=[],drag=null;
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}
function fit(){if(!pts.length)return;const r=canvas.getBoundingClientRect(),xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);view.cx=(minx+maxx)/2;view.cy=(miny+maxy)/2;view.scale=Math.min((r.width-90)/(maxx-minx||1),(r.height-90)/(maxy-miny||1));draw()}
function screen(p){const r=canvas.getBoundingClientRect();return{x:r.width/2+(p.x-view.cx)*view.scale,y:r.height/2-(p.y-view.cy)*view.scale}}
function atDistance(d){let lo=0,hi=cum.length-1;while(lo<hi){const m=(lo+hi)>>1;if(cum[m]<d)lo=m+1;else hi=m}const i=Math.max(1,lo),span=cum[i]-cum[i-1],t=span?(d-cum[i-1])/span:0;return{x:pts[i-1].x+t*(pts[i].x-pts[i-1].x),y:pts[i-1].y+t*(pts[i].y-pts[i-1].y)}}
function draw(){const r=canvas.getBoundingClientRect();if(!r.width||!r.height||!pts.length)return;ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle='#14241e';ctx.fillRect(0,0,r.width,r.height);ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle='#44df86';ctx.lineWidth=4;ctx.beginPath();let q=screen(pts[0]);ctx.moveTo(q.x,q.y);for(let i=1;i<pts.length;i++){q=screen(pts[i]);ctx.lineTo(q.x,q.y)}ctx.stroke();
for(let d=0;d<=total;d+=100){const p=screen(atDistance(d));ctx.fillStyle='#ffd45e';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.font='bold 12px system-ui';ctx.lineWidth=3;ctx.strokeStyle='#14241e';ctx.strokeText(`${d}m`,p.x+5,p.y-6);ctx.fillStyle='#ffe59a';ctx.fillText(`${d}m`,p.x+5,p.y-6)}
picked.forEach((v,i)=>{const p=screen(v.xy);ctx.fillStyle=i===0?'#53e08b':'#ff8277';ctx.beginPath();ctx.arc(p.x,p.y,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke();ctx.font='bold 14px system-ui';ctx.lineWidth=4;ctx.strokeStyle='#14241e';ctx.strokeText(i===0?'A':'B',p.x+10,p.y-10);ctx.fillStyle='white';ctx.fillText(i===0?'A':'B',p.x+10,p.y-10)})}
function nearest(x,y){let best={err:Infinity,d:0,xy:null};for(let i=0;i<pts.length-1;i++){const a=screen(pts[i]),b=screen(pts[i+1]),dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((x-a.x)*dx+(y-a.y)*dy)/l)):0,px=a.x+t*dx,py=a.y+t*dy,err=Math.hypot(x-px,y-py);if(err<best.err){const seg=cum[i+1]-cum[i];best={err,d:cum[i]+seg*t,xy:{x:pts[i].x+(pts[i+1].x-pts[i].x)*t,y:pts[i].y+(pts[i+1].y-pts[i].y)*t}}}}return best}
function report(){document.querySelector('#start').textContent=picked[0]?`시작점 A: ${picked[0].d.toFixed(1)} m`:'시작점 A: 미선택';document.querySelector('#end').textContent=picked[1]?`끝점 B: ${picked[1].d.toFixed(1)} m`:'끝점 B: 미선택';document.querySelector('#result').textContent=picked.length===2?`설정 구간 ${Math.min(picked[0].d,picked[1].d).toFixed(1)}–${Math.max(picked[0].d,picked[1].d).toFixed(1)} m`:'경로 위 시작점과 끝점을 클릭';draw()}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();if(e.button===1||e.shiftKey){drag={x:e.clientX,y:e.clientY,cx:view.cx,cy:view.cy};canvas.setPointerCapture(e.pointerId);return}const q=nearest(e.clientX-r.left,e.clientY-r.top);if(q.err>26){document.querySelector('#result').textContent='경로선 가까이를 클릭해줘';return}if(picked.length===2)picked=[];picked.push(q);report()});canvas.addEventListener('pointermove',e=>{if(drag){view.cx=drag.cx-(e.clientX-drag.x)/view.scale;view.cy=drag.cy+(e.clientY-drag.y)/view.scale;draw()}});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),before=nearest(e.clientX-r.left,e.clientY-r.top);const factor=e.deltaY<0?1.18:1/1.18;view.scale=Math.max(.03,Math.min(view.scale*factor,100));const after=nearest(e.clientX-r.left,e.clientY-r.top);if(before.xy&&after.xy){view.cx+=before.xy.x-after.xy.x;view.cy+=before.xy.y-after.xy.y}draw()},{passive:false});
document.querySelector('#fit').onclick=fit;document.querySelector('#clear').onclick=()=>{picked=[];report()};
new ResizeObserver(resize).observe(canvas);resize();
fetch('/api/route').then(r=>{if(!r.ok)throw Error('global path load failed');return r.json()}).then(d=>{pts=d.waypoints;cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));total=cum[cum.length-1];fit();report()}).catch(e=>document.querySelector('#result').textContent=`경로를 불러오지 못함: ${e.message}`);
</script></body></html>
