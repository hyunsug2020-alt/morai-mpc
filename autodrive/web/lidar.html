<!doctype html>
<html lang="ko" data-theme="spider">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>주행 관제 · 카메라 · LiDAR</title>
  <style>
    :root { --ink:#17211c; --muted:#657168; --paper:#f3f0e8; --panel:#fffdf7; --line:#d7d8ce; --green:#156b4b; --green-light:#dff2e8; --orange:#ef6a34; --blue:#246b93; --red:#b9433f; --shadow:0 12px 34px rgba(30,42,34,.08); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:linear-gradient(rgba(20,55,40,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(20,55,40,.035) 1px,transparent 1px),var(--paper); background-size:28px 28px; font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif; }
    button, input, select { font:inherit; } button { cursor:pointer; }
    .shell { max-width:1480px; margin:auto; padding:28px; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; padding:26px 32px; border:1px solid var(--line); border-radius:22px; background:rgba(255,253,247,.92); box-shadow:var(--shadow); }
    .eyebrow { color:var(--orange); font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:8px 0 7px; font-size:clamp(26px,3.6vw,42px); line-height:1.05; letter-spacing:-.045em; }
    .lead { margin:0; color:var(--muted); font-size:15px; }
    .header-side { min-width:270px; display:grid; gap:8px; }
    .pill { display:flex; align-items:center; gap:9px; padding:9px 13px; border-radius:12px; background:var(--green-light); color:var(--green); font-weight:800; font-size:14px; }
    .pill.error { color:var(--red); background:#fbe7e5; } .pill.warn { color:#8a5a00; background:#fff3d6; }
    .dot { width:9px; height:9px; border-radius:99px; background:currentColor; box-shadow:0 0 0 5px rgba(21,107,75,.1); }
    .facts { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin:18px 0; }
    .fact { padding:14px 16px; border-radius:15px; border:1px solid var(--line); background:rgba(255,255,255,.65); }
    .fact b { display:block; font-size:22px; letter-spacing:-.04em; } .fact span { color:var(--muted); font-size:12px; }
    .layout { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(350px,.7fr); gap:18px; align-items:start; }
    .stack { display:grid; gap:18px; }
    .panel { border:1px solid var(--line); border-radius:18px; background:var(--panel); box-shadow:var(--shadow); overflow:hidden; }
    .panel-head { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); }
    .panel-head h2 { margin:0; font-size:17px; } .panel-head small { color:var(--muted); }
    .panel-body { padding:20px; }
    .step { display:grid; grid-template-columns:42px 1fr; gap:14px; padding:18px 0; border-bottom:1px solid var(--line); }
    .step:first-child { padding-top:0; } .step:last-child { padding-bottom:0; border-bottom:0; }
    .step-num { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; background:var(--ink); color:#fff; font-weight:900; }
    .step h3 { margin:1px 0 4px; font-size:16px; } .step p { margin:0 0 12px; color:var(--muted); font-size:13px; line-height:1.5; }
    .fields { display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
    .fields label { display:grid; gap:4px; font-size:12px; color:var(--muted); font-weight:700; }
    .fields input, .fields select { min-width:120px; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:#fff; }
    .btn { min-height:38px; padding:8px 14px; border:0; border-radius:9px; color:#fff; background:var(--green); font-weight:800; transition:transform .12s,opacity .12s; }
    .btn:hover { transform:translateY(-1px); } .btn:disabled { opacity:.35; cursor:not-allowed; transform:none; }
    .btn.secondary { color:var(--ink); background:#e7e9e2; } .btn.orange { background:var(--orange); } .btn.red { background:var(--red); } .btn.blue { background:var(--blue); }
    .sessions { display:grid; gap:7px; max-height:280px; overflow:auto; margin-bottom:12px; }
    .session { display:grid; grid-template-columns:24px 1fr auto; gap:10px; align-items:center; padding:9px 11px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:13px; }
    .session-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:7px; align-items:center; }
    .session-row .session { min-width:0; }
    .delete-session { min-height:30px; padding:5px 9px; font-size:11px; }
    .path-item.mpc-run { grid-template-columns:1fr auto; }
    .mpc-run > div { min-width:0; }
    .session small { color:var(--muted); display:block; font-size:11px; }
    .tag { padding:2px 7px; border-radius:6px; font-size:11px; font-weight:800; background:#e7e9e2; } .tag.ok { background:var(--green-light); color:var(--green); } .tag.bad { background:#fbe7e5; color:var(--red); }
    .empty { color:var(--muted); font-size:13px; padding:8px 0; }
    .decision-layout { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr); gap:14px; align-items:start; }
    .plan-image { display:block; width:100%; border-radius:12px; background:#181d23; }
    .plan-legend { display:flex; flex-wrap:wrap; gap:8px 14px; margin:10px 0; font-size:12px; }
    .plan-legend i { display:inline-block; width:20px; height:4px; margin-right:5px; vertical-align:middle; border-radius:3px; }
    .decision-card { padding:16px; border:1px solid var(--line); border-radius:12px; font-size:13px; line-height:1.6; background:#fff; }
    .decision-title { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:19px; font-weight:800; }
    .decision-state { color:var(--green); background:var(--green-light); padding:3px 10px; border-radius:8px; }
    .decision-state.stop { color:var(--red); background:#fbe7e5; }
    .decision-state.stale { color:#8a5a00; background:#fff3d6; }
    .decision-reason { padding:12px; margin:12px 0; background:#f1f4f0; border-left:4px solid var(--green); border-radius:6px; font-weight:700; }
    .decision-reason.stop { background:#fff1ed; border-color:var(--red); }
    .decision-section { padding:10px 0; border-top:1px solid var(--line); }
    .decision-section h3 { font-size:12px; color:var(--muted); margin:0 0 5px; }
    .decision-metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:10px 0; }
    .decision-metrics div { padding:9px; border-radius:8px; background:#f6f6f1; }
    .decision-metrics b { display:block; font-size:17px; }
    .decision-metrics small { display:block; color:var(--muted); font-size:11px; }
    .decision-risk { color:var(--red); font-weight:700; }
    .decision-mode { font-size:12px; color:var(--muted); text-align:right; }
    .hud-speed { display:grid; grid-template-columns:1.3fr 1fr; gap:8px; margin:12px 0 6px; }
    .hud-speed div { padding:8px 10px; border-radius:8px; background:#f6f6f1; }
    .hud-speed small { display:block; color:var(--muted); font-size:11px; }
    .hud-speed b { font-size:34px; line-height:1.1; }
    .hud-speed i { margin-left:5px; font-style:normal; color:var(--muted); font-size:12px; }
    .hud-bar { position:relative; height:6px; margin:4px 0 10px; border-radius:3px; background:#e6e6df; }
    .hud-bar-now { position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:var(--green); }
    .hud-bar-target { position:absolute; top:-3px; bottom:-3px; width:3px; background:var(--red); }
    .decision-muted { color:var(--muted); font-size:12px; }
    @media(max-width:900px) { .decision-layout { grid-template-columns:1fr; } }
    .job-box { padding:18px 20px; } .job-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; } .timer { font-variant-numeric:tabular-nums; color:var(--muted); }
    pre { margin:0; padding:12px; max-height:380px; overflow:auto; border-radius:10px; background:#141a17; color:#dfe7e2; font-size:11.5px; line-height:1.45; white-space:pre-wrap; word-break:break-all; }
    .camera-grid { display:grid; grid-template-columns:1fr; gap:10px; }
    .camera { position:relative; min-height:120px; overflow:hidden; border-radius:12px; background:#1b211e; }
    .camera img { width:100%; display:block; object-fit:contain; } .camera img.missing { opacity:0; }
    .camera span { position:absolute; top:8px; left:8px; padding:4px 7px; border-radius:6px; color:#fff; background:rgba(12,20,16,.75); font-size:11px; font-weight:800; }
    .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13px; padding:14px 20px; } .kv b { color:var(--muted); font-weight:700; } .kv code { font-size:12px; }
    .summary { font-size:13px; line-height:1.6; margin:8px 0 12px; padding:10px 12px; border-radius:10px; background:#fff; border:1px solid var(--line); }
    .toast { position:fixed; right:22px; bottom:22px; padding:12px 16px; border-radius:12px; background:var(--ink); color:#fff; opacity:0; transform:translateY(10px); transition:.2s; font-size:14px; max-width:520px; }
    .toast.show { opacity:1; transform:none; } .toast.error { background:var(--red); }
    .guide-link { color:var(--blue); font-weight:700; text-decoration:none; }
    footer { margin-top:22px; color:var(--muted); font-size:12px; text-align:center; }
    @media (max-width:1100px) { .layout { grid-template-columns:1fr; } .facts { grid-template-columns:repeat(3,1fr); } }
    @media (max-width:640px) { .shell { padding:14px; } .facts { grid-template-columns:repeat(2,1fr); } header { flex-direction:column; } }
  </style>
  <link rel="stylesheet" href="/spider-theme.css">
  <style>
    body { margin:0; }
    .ops { max-width:1900px; margin:0 auto; padding:14px; display:grid; gap:12px; }
    .ops-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px;
      background:linear-gradient(90deg,#1a0a10,#0c080e); border:1px solid #5a1a24; border-top:2px solid #ff4055; }
    .ops-head h1 { margin:0; font:800 20px ui-monospace,monospace; letter-spacing:.12em; color:#ffe3e6; text-shadow:0 0 12px #ff4055aa; }
    .ops-head span { color:#ff8b97; font:12px ui-monospace,monospace; }
    .ops-grid { display:grid; grid-template-columns:minmax(0,2.2fr) minmax(330px,.8fr); gap:12px; align-items:start; }
    .tile { position:relative; background:#0c080e; border:1px solid #4a1820; box-shadow:0 0 18px #ff40551a; }
    .tile-title { display:flex; justify-content:space-between; gap:8px; padding:7px 10px; color:#ff8b97;
      font:700 11px ui-monospace,monospace; letter-spacing:.16em; border-bottom:1px solid #3b1820; background:#12090e; }
    .tile-title b { color:#ffe3e6; font-weight:700; letter-spacing:.04em; }
    #stage { position:relative; height:min(72vh,780px); min-height:380px; }
    #stage canvas { position:absolute; inset:0; width:100%; height:100%; }
    #labels { pointer-events:none; }
    .tile-tools { position:absolute; right:10px; top:38px; display:flex; gap:6px; z-index:2; }
    .tile-tools button { background:#2a0d14; color:#ffd5da; border:1px solid #ff405588; padding:5px 10px; font:12px ui-monospace,monospace; cursor:pointer; }
    #cars { padding:8px 10px; color:#ffd5da; font:12px ui-monospace,monospace; border-top:1px solid #3b1820; min-height:34px; }
    #guiCams { width:100%; display:block; }
    .plan-image { width:100%; display:block; }
    .decision-card .hud-speed.now-only { grid-template-columns:1fr; }
    .decision-card .hud-speed.now-only b { font-size:84px; line-height:1; }
    .decision-card .hud-speed.now-only i { font-size:18px; }
    .decision-card .hud-target-small { float:right; margin-top:58px; color:#ffb3bb; font:600 13px ui-monospace,monospace; }
    .side { display:flex; flex-direction:column; gap:12px; }
    .cte { margin-top:6px; }
    .cte-head { display:flex; align-items:center; justify-content:space-between; color:#ff8b97; font:700 12px ui-monospace,monospace; letter-spacing:.08em; }
    .cte-head button { background:#2a0d14; color:#ffd5da; border:1px solid #ff405588; padding:3px 8px; font:11px ui-monospace,monospace; cursor:pointer; }
    .cte-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0; }
    .cte-stats div { background:#0a0d13; border:1px solid #2b3242; padding:6px 10px; }
    .cte-stats small { display:block; color:#8e98ac; font:700 11px ui-monospace,monospace; }
    .cte-stats b { display:block; font:800 34px/1.1 ui-monospace,monospace; color:#fff; }
    .cte-stats b i { font-size:14px; font-style:normal; color:#8e98ac; margin-left:4px; }
    .cte-stats span { color:#c9cfdb; font:12px ui-monospace,monospace; } .cte-stats em { font-style:normal; color:#fff; font-weight:800; font-size:15px; }
    #cteChart { width:100%; height:260px; display:block; }
    .cte-legend { display:flex; flex-wrap:wrap; gap:10px; color:#9aa4b8; font-size:11px; margin-top:4px; }
    .cte-legend i { display:inline-block; width:14px; height:3px; margin-right:4px; vertical-align:middle; }
    .small-card { font-size:12px !important; line-height:1.45 !important; padding:12px 14px !important; }
    .small-card .decision-title { font-size:12px; }
    .small-card .decision-reason { font-size:13px; padding:7px 10px; margin:8px 0; }
    .small-card .decision-metrics b { font-size:16px; }
    .small-card .decision-section h3 { font-size:11px; }

    /* spider dressing: web backdrop, emblem, glow */
    body { background:#07050a radial-gradient(circle at 50% -10%,#3a0c16 0,#07050a 55%) fixed !important; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.10;
      background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='520' height='520' viewBox='-260 -260 520 520' fill='none' stroke='%23ff4055' stroke-width='1.2'><g>%3Cline x1='0' y1='0' x2='260' y2='0'/%3E%3Cline x1='0' y1='0' x2='184' y2='184'/%3E%3Cline x1='0' y1='0' x2='0' y2='260'/%3E%3Cline x1='0' y1='0' x2='-184' y2='184'/%3E%3Cline x1='0' y1='0' x2='-260' y2='0'/%3E%3Cline x1='0' y1='0' x2='-184' y2='-184'/%3E%3Cline x1='0' y1='0' x2='0' y2='-260'/%3E%3Cline x1='0' y1='0' x2='184' y2='-184'/%3E%3Cpath d='M60 0 L42 42 L0 60 L-42 42 L-60 0 L-42 -42 L0 -60 L42 -42Z M120 0 L85 85 L0 120 L-85 85 L-120 0 L-85 -85 L0 -120 L85 -85Z M190 0 L134 134 L0 190 L-134 134 L-190 0 L-134 -134 L0 -190 L134 -134Z'/%3E</g></svg>") center/520px repeat; }
    .ops-head h1::before { content:""; display:inline-block; width:26px; height:26px; margin-right:10px; vertical-align:-6px;
      background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-50 -50 100 100' fill='%23ff4055' stroke='%23ff4055' stroke-width='5' stroke-linecap='round'><ellipse cx='0' cy='8' rx='9' ry='15'/><circle cx='0' cy='-13' r='7'/><path fill='none' d='M-6 -2 L-26 -22 L-30 -42 M6 -2 L26 -22 L30 -42 M-7 4 L-34 -4 L-44 -20 M7 4 L34 -4 L44 -20 M-7 12 L-34 18 L-44 34 M7 12 L34 18 L44 34 M-5 18 L-24 34 L-28 46 M5 18 L24 34 L28 46'/></svg>") center/contain no-repeat;
      filter:drop-shadow(0 0 6px #ff4055); }
    .tile { transition:box-shadow .25s ease; } .tile:hover { box-shadow:0 0 0 1px #ff405566, 0 0 28px #ff405533; }
    .tile::after { content:""; position:absolute; right:-1px; bottom:-1px; width:18px; height:18px; border-right:2px solid #ff4055; border-bottom:2px solid #ff4055; filter:drop-shadow(0 0 4px #ff4055); pointer-events:none; }
    @media (max-width:1300px) { .ops-grid { grid-template-columns:1fr; } }
  </style>

<body>
<main class="ops">
  <div class="ops-head"><h1>SPIDER · DRIVE OPS</h1><span id="aliveTag">대기</span><span id="connection" class="warn">ROS 연결 중</span><span id="health">점군 대기</span><a class="btn secondary" href="/" target="_blank">대시보드</a></div>
  <div class="tile"><div class="tile-title">CAMERAS · SEMANTIC <b>앞 · 좌 · 우</b></div><img id="guiCams" alt="카메라 + 시맨틱"></div>
  <div class="ops-grid">
    <div class="tile"><div class="tile-title">LIDAR + HD MAP 3D <b>점군 · 차선 · 경로 · 인지 한 화면 · 드래그 회전 / 우클릭·Shift 이동 / 휠 확대</b></div>
      <div class="tile-tools"><button id="chase">추적</button><button id="angle">3D</button><button id="top">위에서</button><button id="layerMap">지도 ON</button><button id="layerColor">높이색</button></div>
      <div id="stage"><canvas id="cloud"></canvas><canvas id="labels"></canvas></div>
      <div class="plan-legend">
        <span><i style="background:#9eadc2"></i>HD맵 차선</span><span><i style="background:#ffd296"></i>전역 경로</span>
        <span><i style="background:#ff3c46"></i>제어 경로</span><span><i style="background:#b0324a"></i>허용 도로 범위</span><span><i style="background:#9a7cff"></i>터널 벽</span>
        <span><i style="background:#ff6e78"></i>LiDAR 차량</span><span><i style="background:#ffaa3c"></i>장애물</span><span><i style="background:#78d2ff"></i>보행자</span>
      </div><div id="cars">차량 탐지 대기</div>
</div>
    <div class="side">
      <div class="decision-card big-panel"><div id="speedBox">속도 대기</div>
        <div class="cte"><div class="cte-head"><b>경로 이탈 CTE</b><button id="cteReset">누적 초기화</button></div>
          <div id="cteStats" class="cte-stats">위치 대기</div>
          <canvas id="cteChart"></canvas>
          <div class="cte-legend"><span><i style="background:#ffd296"></i>전역 경로 대비(회피·차선변경 포함)</span><span><i style="background:#ff3c46"></i>제어 경로 추종 오차</span><span>+왼쪽 −오른쪽 · 최근 60초</span></div></div></div>
      <div id="decisionCard" class="decision-card small-card">판단 대기 중</div></div>
  </div>
</main>
    <script>
    (()=>{
     const ACT={KEEP_LANE:"차선 유지",YIELD:"양보 · 감속/정지",LEFT_CHANGE:"왼쪽으로 회피",RIGHT_CHANGE:"오른쪽으로 회피",STOP:"정지",TURN_LEFT:"좌회전",TURN_RIGHT:"우회전",UNKNOWN:"판단 불명",FOLLOW:"앞차 추종"};

  document.getElementById('cteStats').innerHTML=big('전역 경로 이탈',last[1],rms(cteLog,1),cteSum.nr?Math.sqrt(cteSum.route/cteSum.nr):null,cteSum.maxR,'#ffd296')+big('제어 경로 추종',last[2],rms(cteLog,2),cteSum.np?Math.sqrt(cteSum.path/cteSum.np):null,cteSum.maxP,'#ff3c46');}
 setInterval(()=>{sampleCte();drawCte();},100);
 document.getElementById('cteReset').onclick=()=>{cteSum={route:0,path:0,nr:0,np:0,maxR:0,maxP:0};};
 window.addEventListener('beforeunload',()=>ws?.close());loadMap();connect();requestAnimationFrame(render);
})();
</script>
</body></html>
