name: morai-single-pc
services:
  ros:
    build:
      context: ..
      dockerfile: Dockerfile
    image: morai-autodrive:1
    container_name: morai_autodrive
    network_mode: host
    environment:
      ROS_MASTER_URI: http://127.0.0.1:11312
      ROS_IP: 127.0.0.1
      ROSBRIDGE_PORT: "9091"
    volumes:
      - ../../data/autodrive:/data/autodrive
      - ../../data/raw:/data/raw
      - ../ros:/opt/autodrive/ros:ro
      - ../ws/src/moraimpc:/opt/autodrive/ws/src/moraimpc:ro
      - ../ws/src/morai_msgs:/opt/autodrive/ws/src/morai_msgs:ro
    init: true
    restart: unless-stopped
  semantic:
    build:
      context: ..
      dockerfile: Dockerfile.performance_semantic
    image: morai-performance-semantic:20261008
    container_name: alpamayo_semantic
    network_mode: host
    entrypoint: []
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "2"
    command: [python, /app/semantic_sidecar.py, --model, /models/best_fp16.onnx,
              --pipeline, /competition/semantic/pipeline, --live,
              /competition/data/autodrive/semantic_live, --max-fps, "10.0",
              --overlay-hz, "0.2", --gpu-postprocess, "on"]
    volumes:
      - ../semantic_sidecar.py:/app/semantic_sidecar.py:ro
      - ../semantic_gpu_masks.py:/app/semantic_gpu_masks.py:ro
      - ../../semantic/pipeline:/competition/semantic/pipeline:ro
      - ${SEMANTIC_MODEL_DIR}:/models:ro
      - ../../data/autodrive/semantic_live:/competition/data/autodrive/semantic_live
      - /dev/shm/alpamayo_semantic:/dev/shm/alpamayo_semantic
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: all
    init: true
    restart: unless-stopped
  rpc:
    build:
      context: .
      dockerfile: Dockerfile.rpc
    image: morai-single-pc-rpc:20261008
    container_name: alpha_semantic_b0_web
    network_mode: host
    command: [python, -c, "import time; time.sleep(315360000)"]
    init: true
    restart: unless-stopped
